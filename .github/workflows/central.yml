name: Central de Promocoes

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch:          # botao pra rodar na hora

permissions:
  contents: write   # salvar o historico (dados/estado.json)
  pages: write      # publicar a pagina
  id-token: write

concurrency:
  group: central
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
      CENTRAL_ESTADO: dados/estado.json
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Varrer promocoes
        run: python central_promocoes.py
      - name: Salvar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/estado.json
          git diff --cached --quiet || git commit -q -m "Atualiza historico [skip ci]"
          git push -q
      - name: Preparar pagina
        run: mkdir -p _site && cp central.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
